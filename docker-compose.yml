services:
  postgres:
    image: postgres:16-alpine
    container_name: nomos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nomos_db
      POSTGRES_USER: nomos_user
      POSTGRES_PASSWORD: nomos_password
    ports:
      - "5432:5432"
    volumes:
      - nomos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomos_user -d nomos_db"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - nomos-network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nomos-api
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://nomos_user:nomos_password@postgres:5432/nomos_db
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./doutrina_direito_administrativo:/app/doutrinas/administrativo:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nomos-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nomos-client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - nomos-network

volumes:
  nomos_pgdata:

networks:
  nomos-network:
    driver: bridge
